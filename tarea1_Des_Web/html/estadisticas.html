<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Estadisticas</title>
        <link rel="stylesheet" href="/css/smth.css">
    </head>
    <body>
        <h1>Estadisticas</h1>

        <div class="graph">
            <h2>Avisos por dia</h2>
            <img src="/pictures/grafico1.png"
            alt="Gráfico de líneas" width="500">
            <h2>Avisos por tipo</h2>
            <img src="/pictures/grafico2.png" 
            alt="Gráfico de torta" width="500">
            <h2>Avisos por mes</h2>
            <img src="/pictures/grafico3.png"
            alt="Gráfico de barras" width="500">
        </div>

        <div class="botones">
            <button id="portada">Portada</button>
            <button id="portada2" hidden>Portada</button>
            <button id="see-posts" hidden>Ver Adopciones</button>
            <button id="send-post" hidden>Mandar Adopción</button>
            <button id="see-stats" hidden>Observar Estadísticas</button>
        </div>
        <script src="/js/buttons.js"></script>
    </body>
</html>
